<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amata Lynner — проба проходу</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400&display=swap">
<style>
  :root{
    --night:#200F3A; --light:#F3E5F5; --depth:#150830;
  }
  html,body{margin:0;background:var(--night);color:var(--light)}
  body{font:16px/1.6 system-ui,sans-serif; overflow-x:hidden}
  #space{height:1100vh}
  #night{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .win{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);will-change:transform,opacity;opacity:0;pointer-events:none}
  .win .halo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:140%;height:140%;border-radius:50%;
    background:radial-gradient(closest-side, rgba(255,214,170,.28), rgba(255,214,170,0) 70%);filter:blur(6px)}
  .win img{position:relative;display:block;max-width:min(72vw,1100px);max-height:62vh;width:auto;height:auto;
    box-shadow:0 0 90px rgba(0,0,0,.55)}
  .win figcaption{position:relative;margin-top:14px;text-align:center;font-family:"Cormorant SC",serif;font-weight:300;
    letter-spacing:.22em;font-size:15px;color:var(--light)}
  .win figcaption a{color:var(--light);opacity:.55;text-decoration:none;border-bottom:1px solid rgba(243,229,245,.25);
    font-size:12px;letter-spacing:.3em;margin-left:1.2em;pointer-events:auto}
  .win figcaption a:hover{opacity:1}
  #intro{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
  #intro h1{font-family:"Cormorant SC",serif;font-weight:300;letter-spacing:.5em;font-size:clamp(17px,2.6vw,28px);margin:0}
  #intro p{letter-spacing:.35em;font-size:10px;opacity:.5;margin-top:3em}
  #finale{position:fixed;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none}
  #finale .bg{position:absolute;inset:0;background:url(img/dusk.jpg) center/cover;opacity:.18}
  #finale .in{position:relative;text-align:center}
  #finale img{width:min(130px,22vw);opacity:.9}
  #finale nav{margin-top:6vh;display:flex;gap:3.2em;justify-content:center;flex-wrap:wrap}
  #finale a{font-family:"Cormorant SC",serif;color:var(--light);text-decoration:none;letter-spacing:.3em;font-size:14px;opacity:.75}
  #finale a:hover{opacity:1}
</style>
</head>
<body>
<div id="space"></div>
<canvas id="night"></canvas>

<div id="intro"><h1>AMATA&nbsp;LYNNER</h1><p>SCROLL</p></div>

<figure class="win" data-i="0"><div class="halo"></div><img src="img/wana.jpg" alt="">
  <figcaption>WE ARE NOT ALONE<a href="https://www.amatalynner.com/films">FILMS</a></figcaption></figure>
<figure class="win" data-i="1"><div class="halo"></div><img src="img/forge.jpg" alt="">
  <figcaption>INTERPIPE STEEL<a href="https://www.amatalynner.com/projects">PROJECTS</a></figcaption></figure>
<figure class="win" data-i="2"><div class="halo"></div><img src="img/wreath.jpg" alt="">
  <figcaption>PHOTOGRAPHY<a href="https://www.amatalynner.com/people">PEOPLE</a></figcaption></figure>
<figure class="win" data-i="3"><div class="halo"></div><img src="img/step.jpg" alt="">
  <figcaption>STEP SEQUENCE<a href="https://www.amatalynner.com/step-sequence">FILM</a></figcaption></figure>
<figure class="win" data-i="4"><div class="halo"></div><img src="img/bridge.jpg" alt="">
  <figcaption>URBAN LINES<a href="https://www.amatalynner.com/projects">PROJECTS</a></figcaption></figure>

<div id="finale"><div class="bg"></div><div class="in">
  <img src="img/monogram.png" alt="AL">
  <nav>
    <a href="https://www.amatalynner.com/films">FILMS</a>
    <a href="https://www.amatalynner.com/projects">PROJECTS</a>
    <a href="https://www.amatalynner.com/people">PHOTOGRAPHY</a>
    <a href="https://www.amatalynner.com/about">ABOUT</a>
    <a href="https://www.amatalynner.com/contact">CONTACT</a>
  </nav>
</div></div>

<script>
// Проба проходу: скролл = час. Детермінована сцена, її палітра, закон видимості на вході.
const V = new URLSearchParams(location.search).get('v') || 'a';   // a: коридор по центру · b: вогні врозкид
const XOFF = V==='b' ? [-16, 13, -11, 15, 0] : [0,0,0,0,0];       // vw

const cv = document.getElementById('night'), cx = cv.getContext('2d');
const wins = [...document.querySelectorAll('.win')];
const intro = document.getElementById('intro'), finale = document.getElementById('finale');

function rs(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', rs); rs();

// mulberry32 — той самий сид-шум, що в фільмах
function mul(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const rnd = mul(20261015);
const STARS = Array.from({length:110},()=>({x:rnd(),y:rnd(),r:.4+rnd()*1.1,ph:rnd()*6.283,sp:.2+rnd()*.5}));

// вікна: сегменти в t (0..1)
const SEG = [[.10,.26],[.26,.42],[.42,.58],[.58,.74],[.74,.88]];
const ease = x => x<0?0:x>1?1:x*x*(3-2*x);

let tTarget = 0, t = 0;
addEventListener('scroll', ()=>{ tTarget = scrollY / (document.body.scrollHeight - innerHeight); }, {passive:true});

function frame(now){
  t += (tTarget - t) * 0.09;            // кінематографічна інерція
  const W = cv.width, H = cv.height, time = now/1000;

  // ніч: індиго, ледь глибше до країв
  const g = cx.createRadialGradient(W/2,H*.45,0, W/2,H*.45, Math.max(W,H)*.8);
  g.addColorStop(0,'#200F3A'); g.addColorStop(1,'#150830');
  cx.fillStyle = g; cx.fillRect(0,0,W,H);

  // точки: на вході — на межі видимості (закон видимості: мало серед схожого), далі трохи сміливіше
  const fieldA = t<.1 ? .05+.05*ease(t/.1) : .10 + .05*ease((t-.1)/.9);
  for (const s of STARS){
    const tw = .5+.5*Math.sin(time*s.sp + s.ph);
    const a = fieldA * (0.25 + 0.75*tw);
    cx.fillStyle = `rgba(243,229,245,${a})`;
    cx.beginPath();
    cx.arc(s.x*W, (s.y*H - t*H*.22 + H)%H, s.r*devicePixelRatio, 0, 6.283);
    cx.fill();
  }

  // вступ: імʼя ледь проступає і тане
  intro.style.opacity = Math.max(0, .85 - t*9) * (0.55 + 0.1*Math.sin(time*.8));

  // вікна: точка світла → кадр → відпускання
  wins.forEach((w,i)=>{
    const [a,b] = SEG[i], p = (t-a)/(b-a);
    if (p < -0.08 || p > 1.3){ w.style.opacity = 0; return; }
    const grow = ease(p*1.9);                    // 0..~0.53 — розгін
    const leave = ease((p-1)*4);                 // після 1 — відпускання вгору
    const s = 0.015 + grow*(1-0.015);
    const y = -leave*42;                         // vh вгору
    const x = XOFF[i]*(1-grow*.6);
    w.style.transform = `translate(calc(-50% + ${x}vw), calc(-50% + ${y}vh)) scale(${s})`;
    // перекличка: поки вікно ще точка — дихає; сусідні в протифазі
    const breathe = p<0.22 ? 0.45+0.4*Math.sin(time*2.1 + i*3.1416) : 1;
    w.style.opacity = Math.max(0, ease(p*6) * (1-leave)) * breathe;
    w.querySelector('.halo').style.opacity = Math.max(0, .9 - grow*.9);
    w.querySelector('figcaption').style.opacity = ease((p-.55)*4) * (1-leave);
    w.style.pointerEvents = (p>.4 && p<1.05) ? 'auto' : 'none';
  });

  // фінал: підпис і двері
  const f = ease((t-.88)/.09);
  finale.style.opacity = f;
  finale.style.pointerEvents = f>.5 ? 'auto' : 'none';

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
