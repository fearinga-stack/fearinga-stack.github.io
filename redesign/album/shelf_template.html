<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500&display=swap">
<style>
{{BASE_CSS}}
{{COVER_CSS}}
body{display:block;overflow:auto;padding:9vh 16px 12vh}
main{max-width:72rem;margin:0 auto}
h1{font-weight:500;letter-spacing:.16em;font-size:clamp(1.3rem,2.2vw,1.8rem);margin:0 0 2.4rem;text-align:center}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:clamp(18px,2.4vw,32px)}
.tile{display:block;text-decoration:none;color:inherit;aspect-ratio:600/430;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .35s ease,box-shadow .35s ease}
.tile:hover,.tile:focus-visible{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 14px 30px rgba(0,0,0,.55);outline:none}
.tile .cover{height:100%}
.rule{grid-column:1/-1;border:none;height:1px;background:rgba(243,229,245,.35);margin:clamp(10px,2vw,22px) 0}
</style>
</head>
<body>
<main>
<h1>Photography</h1>
<div class="shelf">
{{ITEMS}}
</div>
</main>
</body>
</html>
