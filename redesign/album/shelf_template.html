<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photography albums</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500&family=Cormorant+Garamond:ital@1&display=swap">
<style>
:root{--night:#200F3A;--light:#F3E5F5;--dim:rgba(243,229,245,.55)}
body{margin:0;background:var(--night);color:var(--light);font-family:"Cormorant SC",Georgia,serif;padding:10vh 16px}
main{max-width:40rem;margin:0 auto}
h1{font-weight:500;letter-spacing:.14em;font-size:1.6rem;margin:0 0 2rem}
ul{list-style:none;padding:0;margin:0}
li{border-top:1px solid rgba(243,229,245,.15);padding:.9rem 0;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
a{color:var(--light);text-decoration:none;font-size:1.2rem;letter-spacing:.06em}
span{color:var(--dim);font-family:"Cormorant Garamond",serif;font-style:italic}
</style>
</head>
<body><main><h1>Photography</h1><ul>
{{ITEMS}}
</ul></main></body>
</html>
