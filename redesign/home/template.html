<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amata Lynner</title>
<link rel="icon" type="image/png" href="../../assets/img/brand/monogram-lavender.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap">
<link rel="stylesheet" href="../films/strip.css">
<style>
:root{--night:#200F3A;--light:#F3E5F5;--depth:#150830;--dim:rgba(243,229,245,.6);--hair:rgba(243,229,245,.22)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night);color:var(--light);font-family:"Cormorant Garamond",Georgia,serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}

{{CHROME_CSS}}

/* the diptych: her photograph and the same page still being made */
.diptych{position:relative;height:100svh;min-height:520px;overflow:hidden;user-select:none;-webkit-user-select:none}
.layer{position:absolute;inset:0}
.layer img{width:100%;height:100%;object-fit:cover;display:block}
.layer.machine{clip-path:inset(0 0 0 var(--seam,50%))}
.veil{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(rgba(21,8,48,.62) 0%,rgba(32,15,58,0) 16%,rgba(32,15,58,0) 55%,rgba(32,15,58,.66))}
.seam-line{position:absolute;top:0;bottom:0;left:var(--seam,50%);width:1px;background:var(--light);opacity:.85;z-index:3;pointer-events:none}
.seam-handle{position:absolute;top:50%;left:var(--seam,50%);transform:translate(-50%,-50%);z-index:3;pointer-events:none;
  border:1px solid var(--light);background:var(--depth);font:500 .62rem "Cormorant SC",serif;letter-spacing:.26em;padding:.45rem .6rem;white-space:nowrap}
.diptych input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:4;margin:0;
  -webkit-appearance:none;appearance:none}
.diptych h1{position:absolute;z-index:3;left:0;right:0;bottom:4.6rem;margin:0;text-align:center;pointer-events:none;
  font:500 clamp(1.05rem,2.3vw,1.75rem)/1.25 "Cormorant SC",serif;letter-spacing:.06em;padding:0 16px;
  text-shadow:0 1px 18px rgba(21,8,48,.85)}
.diptych h1 span{display:block}
.side{position:absolute;bottom:1.3rem;z-index:5;font:500 .74rem "Cormorant SC",serif;letter-spacing:.28em}
.side small{display:block;margin-top:.3rem;font:italic .85rem "Cormorant Garamond",serif;letter-spacing:.04em;color:var(--dim)}
.side.camera{left:16px}
.side.machine{right:16px;text-align:right}
.side a{border-bottom:1px solid var(--hair);padding-bottom:.12rem}

/* the two sides of the seam */
.hands{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);gap:clamp(1.4rem,4vw,3.4rem);
  max-width:76rem;margin:0 auto;padding:clamp(3rem,10vh,6rem) 16px clamp(2rem,6vh,3.5rem)}
.hands .seam{background:var(--hair)}
.hand h2{margin:0 0 1rem;font:500 clamp(1.3rem,2.4vw,1.8rem) "Cormorant SC",serif;letter-spacing:.12em}
.hand p{margin:0 0 1.6rem;font-size:1.16rem;line-height:1.6;color:rgba(243,229,245,.86);max-width:34rem}
.go{display:inline-block;margin-top:1.2rem;font:500 .78rem "Cormorant SC",serif;letter-spacing:.24em;border-bottom:1px solid var(--hair);padding-bottom:.15rem}
.go:hover{border-color:var(--light)}

/* camera: album covers */
.covers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{display:block;aspect-ratio:600/430;box-shadow:0 6px 16px rgba(0,0,0,.45);transition:transform .3s ease}
.tile:hover{transform:translateY(-3px) rotate(-.4deg)}
.cover{display:flex;flex-direction:column;height:100%;position:relative;container-type:size}
.cover h2{margin:0;font-weight:500;font-family:"Cormorant SC",serif}
.cover img{position:absolute;right:6%;bottom:6%;width:11%;opacity:.85}
{{COVER_CSS}}

/* machine: one strip of every film's opening frame */
.hand .strip{--frameh:clamp(70px,8vw,104px);display:block;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.opener{display:block;flex:none}
.opener .frame img{filter:brightness(.85)}
.opener:hover .frame img{filter:none}

.note{max-width:44rem;margin:0 auto;padding:0 16px clamp(3rem,9vh,5rem);text-align:center;
  font-style:italic;font-size:clamp(1.15rem,2vw,1.4rem);line-height:1.5;color:rgba(243,229,245,.82)}


@media (max-width:760px){
  .hands{grid-template-columns:minmax(0,1fr)}
  .hands .seam{height:1px}
  .covers{grid-template-columns:repeat(2,minmax(0,1fr))}
  .diptych h1{bottom:5.6rem}
}
</style>
</head>
<body>
{{TOPBAR}}
<main>
  <section class="diptych" id="diptych" style="--seam:50%">
    <div class="layer camera"><img src="../d-two-ways/roses/photo.jpg" alt="Dried roses on a page of an old Versailles directory — photograph"></div>
    <div class="layer machine"><img src="../d-two-ways/roses/forming.jpg" alt="The same page, still being generated"></div>
    <div class="veil"></div>
    <div class="seam-line"></div>
    <div class="seam-handle">◂ DRAG ▸</div>
    <h1><span>I make images two ways —</span><span>with a camera, and with a machine that dreams.</span></h1>
    <input type="range" id="seam" min="0" max="100" value="50" step="0.1" aria-label="Move the seam between the camera and the machine">
    <div class="side camera"><a href="../album/index.html">The Camera</a><small>documentary · fine art · people</small></div>
    <div class="side machine"><a href="../films/index.html">The Machine</a><small>short films · commercial · series</small></div>
  </section>

  <section class="hands">
    <div class="hand">
      <h2>The Camera</h2>
      <p>{{CAMERA}}</p>
      <div class="covers">
{{TILES}}
      </div>
      <a class="go" href="../album/index.html">PHOTOGRAPHY →</a>
    </div>
    <div class="seam" aria-hidden="true"></div>
    <div class="hand">
      <h2>The Machine</h2>
      <p>{{MACHINE}}</p>
      <div class="strip">{{REEL}}</div>
      <a class="go" href="../films/index.html">FILMS →</a>
    </div>
  </section>

  <p class="note">{{NOTE}}</p>
</main>
{{FOOTER}}
<script src="../films/strip.js"></script>
<script>
(function(){var d=document.getElementById('diptych'),r=document.getElementById('seam');
r.addEventListener('input',function(){d.style.setProperty('--seam',r.value+'%')});})();
</script>
</body>
</html>
