<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Films</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500&family=Cormorant+Garamond:ital@0;1&display=swap">
<link rel="stylesheet" href="strip.css">
<style>
:root{--night:#200F3A;--light:#F3E5F5;--depth:#150830;--dim:rgba(243,229,245,.55);--base:#0b0710;--frameh:clamp(96px,11.5vw,158px)}
body{margin:0;background:var(--night);color:var(--light);font-family:"Cormorant SC",Georgia,serif;padding:9vh 0 12vh;overflow-x:hidden}
header{max-width:72rem;margin:0 auto 3.5rem;padding:0 16px;text-align:center}
header h1{font-weight:500;letter-spacing:.16em;font-size:clamp(1.3rem,2.2vw,1.8rem);margin:0}
header p{margin:.6rem auto 0;max-width:36rem;color:var(--dim);font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.05rem}
.film{margin:0 0 clamp(3rem,7vh,5rem)}
.caption{max-width:72rem;margin:1.1rem auto 0;padding:0 16px;display:grid;grid-template-columns:minmax(0,14rem) minmax(0,1fr);gap:.4rem 2rem;align-items:baseline}
.caption h2{margin:0;font-weight:500;letter-spacing:.1em;font-size:clamp(1.15rem,1.8vw,1.5rem)}
.caption h2 a{color:inherit;text-decoration:none}
.logline{margin:0;font-family:"Cormorant Garamond",serif;font-size:1.08rem;line-height:1.5;color:rgba(243,229,245,.86)}
.meta{grid-column:2;margin:0;font-size:.72rem;letter-spacing:.22em;color:var(--dim)}
.awards{grid-column:2;margin:.2rem 0 0;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.98rem;color:rgba(243,229,245,.75)}
@media (max-width:640px){.caption{grid-template-columns:1fr}.meta,.awards{grid-column:1}}
</style>
</head>
<body>
<header><h1>Films</h1><p>{{LEAD}}</p></header>
{{FILMS}}
<script src="strip.js"></script>
</body>
</html>
